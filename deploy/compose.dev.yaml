name: qual-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: qual
      POSTGRES_DB: qual
      POSTGRES_PASSWORD: ${QUAL_DB_PASSWORD:-qual_dev_only}
    ports:
      - "127.0.0.1:${QUAL_DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qual -d qual"]
      interval: 5s
      timeout: 3s
      retries: 12

  objectstore:
    image: chrislusf/seaweedfs:4.51
    environment:
      AWS_ACCESS_KEY_ID: ${QUAL_S3_ACCESS_KEY:-qualdev}
      AWS_SECRET_ACCESS_KEY: ${QUAL_S3_SECRET_KEY:-qual_dev_only}
      S3_BUCKET: qual-artifacts
    ports:
      - "127.0.0.1:${QUAL_S3_PORT:-18333}:8333"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
