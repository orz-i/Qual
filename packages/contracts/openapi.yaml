      summary: Resolve minimal display identities of known Principals in the project
      description: |
        Requires work:read with current scoped credential and project membership.
        Only active members of the requested project (or its Workspace Admin)
        are returned. Does not enumerate all members or return their roles,
        permissions, credential scopes, tokens, or contact information.
        Requests contain 1..50 nonzero UUIDs, comma separated.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: ids
          in: query
