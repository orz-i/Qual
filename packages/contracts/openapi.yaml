  /api/v1/projects/{projectID}/access/{principalID}/permissions/{permission}:
    put:
      tags: [Access]
      operationId: changeProjectPermission
      summary: Change a Project member's permission (allow, deny, inherit)
      description: |
        Requires access:manage and a valid Idempotency-Key. Optimistic expected_version
        is 0 for an initial override. Humans and explicitly delegated Agents can
        manage ordinary permissions. Only a Human Workspace Admin can delegate
        access:manage; no Principal can modify its own permissions.
        All mutations are one PostgreSQL transaction with immutable change
        history, Audit, Activity and Outbox. No Agent execution occurs.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/AccessPrincipalID'
        - $ref: '#/components/parameters/AccessPermissionPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionChangeInput'
      responses:
