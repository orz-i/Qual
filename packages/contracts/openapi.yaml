      - $ref: '#/components/parameters/RunID'
    post:
      tags: [AgentRuns]
      operationId: reportAgentRun
      summary: Append a status observation or throttled heartbeat
      description: |
        Requires explicit run:report, matching reporter Principal, an expected
        Run version and Idempotency-Key. Unique source_report_id and payload
        prevent replay forgery. Older occurred_at observations are archived
