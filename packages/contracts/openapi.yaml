          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/audit:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [History]
      operationId: listProjectAudit
      summary: Read authorized audit metadata (audit:read scope)
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful read or mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
components:
  securitySchemes:
    OperationalToken:
      type: http
      scheme: bearer
      description: Separate operator-only metrics token, never an Agent or Human PAT.
    BrowserSession:
      type: apiKey
      in: cookie
      name: qual_session
      description: Only available on configured loopback browser origins; CSRF+Origin required for writes
    BearerToken:
      type: http
      scheme: bearer
      description: |
        Scoped high-entropy PAT for controlled environments only.
        Never use in browser localStorage. OAuth/OIDC is not yet available.
  parameters:
    BrowserOrigin:
      name: Origin
      in: header
      required: false
      schema: {type: string}
      description: Exact configured local browser origin.
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 64, maxLength: 64}
      description: Session-bound CSRF token retrieved from GET /api/v1/auth/session.
    CaseID:
      name: caseID
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunID:
      name: runID
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptID:
      name: attemptID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReportFilename:
      name: X-Report-Filename
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
      description: Simple XML report filename, no path segments.
    ArtifactID:
      name: artifactID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExportID:
      name: exportID
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubscriptionID:
      name: subscriptionID
      in: path
      required: true
      schema: {type: string, format: uuid}
    TargetKindQuery:
      name: target_kind
      in: query
      required: true
      schema: {$ref: '#/components/schemas/ArtifactTargetKind'}
    TargetIDQuery:
      name: target_id
      in: query
      required: true
      schema: {type: string, format: uuid}
    AccessPrincipalID:
      name: principalID
      in: path
      required: true
      schema: {type: string, format: uuid}
    AccessPermissionPath:
      name: permission
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PermissionName'}
    WorkItemID:
      name: itemID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemID:
      name: itemID
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Double-quoted integer version, for example "3"
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048}
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/Status'
    KindFilter:
      name: kind
      in: query
      schema:
        $ref: '#/components/schemas/Kind'
  responses:
    BadRequest:
      description: HTTP 400 API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: HTTP 401 API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: HTTP 403 API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: HTTP 404 API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: HTTP 409 API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: HTTP 422 API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Precondition:
      description: HTTP 428 API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    BrowserLoginRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: One-time offline-generated code; never use an Agent PAT.
    BrowserSessionResponse:
      type: object
      required: [principal, projects, csrf_token]
      properties:
        principal:
          $ref: '#/components/schemas/PrincipalInfo'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        csrf_token:
          type: string
          description: Only for in-memory browser use, not a credential.
    PrincipalInfo:
      type: object
      required: [id, workspace_id, display_name, kind]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        display_name: {type: string}
        kind: {type: string, enum: [human]}
    Project:
      type: object
      required: [id, workspace_id, key]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        key: {type: string}
    ProjectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PermissionName:
      type: string
      enum: [work:read, work:write, work:claim, work:review, audit:read,
        test:read, test:write, artifact:read, artifact:write, event:write, run:report,
        archive:export, webhook:manage, access:manage]
    PermissionEffect:
      type: string
      enum: [inherit, allow, deny]
    PermissionSetting:
      type: object
      required: [permission, effect, version, allowed_by_project]
      properties:
        permission: {$ref: '#/components/schemas/PermissionName'}
        effect: {$ref: '#/components/schemas/PermissionEffect'}
        version: {type: integer, minimum: 0}
        allowed_by_project:
          type: boolean
          description: Project-level ability only; a credential must also contain the scope.
    ProjectPrincipalSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, kind]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        kind: {type: string, enum: [human, agent, integration]}
    ProjectPrincipalPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/ProjectPrincipalSummary'}
    AccessMember:
      type: object
      required: [principal_id, display_name, kind, role, permissions]
      properties:
        principal_id: {type: string, format: uuid}
        display_name: {type: string}
        kind: {type: string, enum: [human, agent, integration]}
        role: {type: string, enum: [workspace_admin, project_maintainer, project_member, project_viewer]}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PermissionSetting'}
    AccessMemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AccessMember'}
    SelfAccess:
      type: object
      required: [project_id, principal_id, kind, role, credential_scopes, effective_permissions]
      properties:
        project_id: {type: string, format: uuid}
        principal_id: {type: string, format: uuid}
        kind: {type: string, enum: [human, agent, integration]}
        role: {type: string, enum: [workspace_admin, project_maintainer, project_member, project_viewer]}
        credential_scopes: {type: array, items: {$ref: '#/components/schemas/PermissionName'}}
        effective_permissions: {type: array, items: {$ref: '#/components/schemas/PermissionName'}}
    PermissionChangeInput:
      type: object
      additionalProperties: false
      required: [effect, expected_version, reason]
      properties:
        effect: {$ref: '#/components/schemas/PermissionEffect'}
        expected_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 3, maxLength: 500}
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ready, unavailable]}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string, format: uuid}
    Kind:
      type: string
      enum: [task, bug]
    Status:
      type: string
      enum: [backlog, todo, in_progress, in_review, done, cancelled]
    Priority:
      type: string
      enum: [urgent, high, medium, low]
    BugDetails:
      type: object
      required: [severity]
      properties:
        severity: {type: string, enum: [blocker, critical, major, minor, trivial]}
        reproduction_steps: {type: string}
        expected_behavior: {type: string}
        actual_behavior: {type: string}
        environment: {type: string}
    CreateWorkItem:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind:
          $ref: '#/components/schemas/Kind'
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        acceptance_criteria:
          type: array
          maxItems: 30
          items: {type: string, minLength: 1, maxLength: 2000}
        priority:
          $ref: '#/components/schemas/Priority'
        bug_details:
          $ref: '#/components/schemas/BugDetails'
    UpdateWorkItem:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        acceptance_criteria:
          type: array
          maxItems: 30
          items: {type: string, minLength: 1, maxLength: 2000}
        priority:
          $ref: '#/components/schemas/Priority'
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    ReassignWorkItemRequest:
      type: object
      additionalProperties: false
      required: [expected_version, new_assignee_id]
      properties:
        expected_version: {type: integer, minimum: 1}
        new_assignee_id: {type: string, format: uuid}
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [status, expected_version]
      description: |
        Status done is a legacy transition and becomes unavailable after
        Goose13; clients must submit DoneDecisionInput to /complete instead.
      properties:
        status:
          $ref: '#/components/schemas/Status'
        expected_version: {type: integer, minimum: 1}
    TaskAuthorizationPolicy:
      type: object
      additionalProperties: false
      required: [project_id, mode, version, source, schema_ready]
      properties:
        project_id: {type: string, format: uuid}
        mode: {type: string, enum: [legacy, task_scoped]}
        version: {type: integer, minimum: 0}
        source: {type: string, enum: [default, project]}
        schema_ready:
          type: boolean
          description: Full forward-only Goose20 schema, including immutable Run binding and reviewer relation
    TaskAuthorizationPolicyPreview:
      type: object
      additionalProperties: false
      required: [current, target_mode, would_change, legacy_scope_widening,
        requires_legacy_widening_ack, work_items_total, unassigned_open_items]
      properties:
        current: {$ref: '#/components/schemas/TaskAuthorizationPolicy'}
        target_mode: {type: string, enum: [legacy, task_scoped]}
        would_change: {type: boolean}
        legacy_scope_widening: {type: boolean}
        requires_legacy_widening_ack: {type: boolean}
        work_items_total: {type: integer, minimum: 0}
        unassigned_open_items: {type: integer, minimum: 0}
    TaskAuthorizationPolicyChange:
      type: object
      additionalProperties: false
      required: [mode, expected_version, reason, acknowledge_legacy_widening]
      properties:
        mode: {type: string, enum: [legacy, task_scoped]}
        expected_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 16, maxLength: 2000}
        acknowledge_legacy_widening:
          type: boolean
          description: Must be true when switching target to legacy, which may restore old broad project scopes
    ProjectReviewPolicy:
      type: object
      additionalProperties: false
      required: [project_id, default_mode, owner_acceptance_allowed,
        force_independent_for_high_risk, version, source]
      properties:
        project_id: {type: string, format: uuid}
        default_mode: {type: string, enum: [independent_review, owner_acceptance]}
        owner_acceptance_allowed: {type: boolean}
        force_independent_for_high_risk: {type: boolean}
        version: {type: integer, minimum: 0}
        source: {type: string, enum: [project_default, project]}
    ProjectReviewPolicyChange:
      type: object
      additionalProperties: false
      required: [default_mode, owner_acceptance_allowed,
        force_independent_for_high_risk, expected_version, reason]
      properties:
        default_mode: {type: string, enum: [independent_review, owner_acceptance]}
        owner_acceptance_allowed: {type: boolean}
        force_independent_for_high_risk: {type: boolean}
        expected_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 16, maxLength: 2000}
    WorkReviewPolicy:
      type: object
      additionalProperties: false
      required: [project_id, work_item_id, mode, source, project_policy_version,
        override_version, work_version, owner_acceptance_allowed,
        force_independent_for_high_risk, high_risk, forced_independent]
      properties:
        project_id: {type: string, format: uuid}
        work_item_id: {type: string, format: uuid}
        mode: {type: string, enum: [independent_review, owner_acceptance]}
        source: {type: string, enum: [project_default, project, work_item]}
        project_policy_version: {type: integer, minimum: 0}
        override_version: {type: integer, minimum: 0}
        work_version: {type: integer, minimum: 1}
        owner_acceptance_allowed: {type: boolean}
        force_independent_for_high_risk: {type: boolean}
        high_risk: {type: boolean}
        forced_independent: {type: boolean}
    WorkReviewPolicyChange:
      type: object
      additionalProperties: false
      required: [mode, expected_version, expected_policy_version, reason]
      properties:
        mode: {type: string, enum: [independent_review, owner_acceptance]}
        expected_version: {type: integer, minimum: 1}
        expected_policy_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 16, maxLength: 2000}
    WorkAcceptanceDecision:
      type: object
      additionalProperties: false
      required: [id, actor_id, acceptance_mode, independent, explicit_self_review,
        reviewer_entry_id, reason, policy_source, policy_version,
        reference_kind, reference_value, work_version_before,
        work_version_after, accepted_at]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        acceptance_mode: {type: string, enum: [independent_review, owner_acceptance]}
        independent: {type: boolean}
        explicit_self_review: {type: boolean}
        reviewer_entry_id: {type: [string, 'null'], format: uuid}
        reason: {type: string}
        policy_source: {type: string, enum: [project, work_item]}
        policy_version: {type: integer, minimum: 1}
        reference_kind: {type: string, enum: [test_run, artifact]}
        reference_value: {type: string, format: uuid}
        work_version_before: {type: integer, minimum: 1}
        work_version_after: {type: integer, minimum: 2}
        accepted_at: {type: string, format: date-time}
    WorkAcceptanceHistory:
      type: object
      additionalProperties: false
      required: [work_item_id, work_status, work_version, acceptance_mode, decision]
      properties:
        work_item_id: {type: string, format: uuid}
        work_status: {$ref: '#/components/schemas/Status'}
        work_version: {type: integer, minimum: 1}
        acceptance_mode: {type: string, enum: [not_completed, legacy_unclassified, independent_review, owner_acceptance]}
        decision:
          oneOf:
            - $ref: '#/components/schemas/WorkAcceptanceDecision'
            - type: 'null'
    DoneDecisionInput:
      type: object
      additionalProperties: false
      required: [acceptance_mode, expected_version, reference_kind, reference_value,
        acknowledge_self_review]
      properties:
        acceptance_mode: {type: string, enum: [independent_review, owner_acceptance]}
        expected_version: {type: integer, minimum: 1}
        reason: {type: string, maxLength: 2000}
        acknowledge_self_review: {type: boolean}
        reference_kind: {type: string, enum: [test_run, artifact]}
        reference_value: {type: string, format: uuid}
    CommentRequest:
      type: object
      additionalProperties: false
      required: [body, expected_version]
      properties:
        body: {type: string, minLength: 1, maxLength: 10000}
        expected_version: {type: integer, minimum: 1}
    DependencyRequest:
      type: object
      additionalProperties: false
      required: [to_item_id, expected_version]
      properties:
        to_item_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
    RoleCapacity:
      type: string
      enum: [executor, tester, reviewer, auditor]
    RoleOutcome:
      type: string
      enum: [observed, passed, failed, needs_work]
    RoleReferenceKind:
      type: string
      enum: [none, git_commit, test_run, artifact]
    RoleEntryInput:
      type: object
      additionalProperties: false
      required: [capacity, outcome, summary, reference_kind, reference_value, expected_version]
      properties:
        capacity: {$ref: '#/components/schemas/RoleCapacity'}
        outcome: {$ref: '#/components/schemas/RoleOutcome'}
        summary: {type: string, minLength: 1, maxLength: 5000}
        reference_kind: {$ref: '#/components/schemas/RoleReferenceKind'}
        reference_value: {type: string, maxLength: 128}
        expected_version: {type: integer, minimum: 1}
    RoleEntry:
      type: object
      required: [id, project_id, work_item_id, actor_id, capacity, outcome, summary, reference_kind, reference_value, work_version, work_status, self_review, recorded_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        work_item_id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        capacity: {$ref: '#/components/schemas/RoleCapacity'}
        outcome: {$ref: '#/components/schemas/RoleOutcome'}
        summary: {type: string}
        reference_kind: {$ref: '#/components/schemas/RoleReferenceKind'}
        reference_value: {type: string}
        work_version: {type: integer, minimum: 1}
        work_status: {type: string, enum: [backlog, todo, in_progress, in_review, done, cancelled]}
        self_review: {type: boolean}
        recorded_at: {type: string, format: date-time}
    RoleEntriesPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RoleEntry'}
    ReviewQueueDecision:
      type: object
      additionalProperties: false
      required: [id, actor_id, outcome, summary, reference_kind,
        reference_value, work_version, self_review, recorded_at]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        outcome: {$ref: '#/components/schemas/RoleOutcome'}
        summary: {type: string}
        reference_kind: {$ref: '#/components/schemas/RoleReferenceKind'}
        reference_value: {type: string}
        work_version: {type: integer, minimum: 1}
        self_review: {type: boolean}
        recorded_at: {type: string, format: date-time}
    ReviewQueueEntry:
      type: object
      additionalProperties: false
      required: [work_item_id, key, title, kind, status, priority,
        version, assignee_id, updated_at, review_lane, resubmitted_after_review]
      properties:
        work_item_id: {type: string, format: uuid}
        key: {type: string}
        title: {type: string}
        kind: {$ref: '#/components/schemas/Kind'}
        status: {type: string, enum: [in_progress, in_review]}
        review_lane:
          type: string
          enum: [awaiting, needs_work, ready_to_close]
          description: Derived from status, latest Reviewer decision, and a later explicit re-submission transition; never authorizes Done.
        resubmitted_after_review:
          type: boolean
          description: |
            True only while in_review after a server-audited transition back to
            in_review with version greater than the latest Reviewer record.
            Previous failed/needs_work history remains unchanged; a new real
            review decision is required before acceptance.
        priority: {$ref: '#/components/schemas/Priority'}
        version: {type: integer, minimum: 1}
        assignee_id: {type: [string, 'null'], format: uuid}
        updated_at: {type: string, format: date-time}
        latest_review: {$ref: '#/components/schemas/ReviewQueueDecision'}
    ReviewQueuePage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReviewQueueEntry'}
        has_more: {type: boolean}
        next_offset: {type: integer, minimum: 1}
    AttentionItem:
      type: object
      additionalProperties: false
      required: [work_item_id, key, title, status, priority, assignee_id,
        reason, source_kind, source_id, source_label, observed_at, hint_only]
      properties:
        work_item_id: {type: string, format: uuid}
        key: {type: string}
        title: {type: string}
        status: {$ref: '#/components/schemas/Status'}
        priority: {$ref: '#/components/schemas/Priority'}
        assignee_id: {type: [string, 'null'], format: uuid}
        reason:
          type: string
          enum: [review_needs_work, review_awaiting, review_ready, run_blocked,
            run_stale, run_unknown, event_needs_input]
        source_kind: {type: string, enum: [review, agent_run, external_event]}
        source_id: {type: string, format: uuid, description: 'Real immutable source ID, or WorkItem ID when no Reviewer record yet'}
        source_label: {type: string, description: 'Source outcome/provider label, not an authenticated actor'}
        observed_at: {type: string, format: date-time, description: 'Server-persisted observation timestamp used for ordering'}
        source_at: {type: string, format: date-time, description: 'Optional untrusted source-reported timestamp; never used for ordering'}
        hint_only: {type: boolean, description: 'True for external Run/Event clues; cannot authorize a business decision'}
    AttentionPage:
      type: object
      additionalProperties: false
      required: [items, has_more, paging_limited]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/AttentionItem'}
        has_more: {type: boolean}
        next_offset: {type: integer, minimum: 1, maximum: 450}
        paging_limited: {type: boolean, description: 'True when a further page exceeds the bounded 500-item projection'}
    WorkContextSummary:
      type: object
      additionalProperties: false
      required: [id, key, title, description, acceptance_criteria, kind, status, priority, version, assignee_id, accountable_owner_id]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        title: {type: string}
        description: {type: string, maxLength: 20000, description: 'Full WorkItem execution contract; source is the WorkItem, not an Agent summary'}
        acceptance_criteria:
          type: array
          maxItems: 30
          items: {type: string, minLength: 1, maxLength: 2000}
        kind: {$ref: '#/components/schemas/Kind'}
        status: {$ref: '#/components/schemas/Status'}
        priority: {$ref: '#/components/schemas/Priority'}
        version: {type: integer, minimum: 1}
        assignee_id: {type: [string, 'null'], format: uuid}
        accountable_owner_id: {type: [string, 'null'], format: uuid}
    WorkContextDependencyFact:
      type: object
      additionalProperties: false
      required: [source, source_key, from_item_id, to_item_id, key, status, version, created_at]
      properties:
        source: {type: string, const: work_dependencies}
        source_key:
          type: string
          description: Stable composite relation key projectID/from_item_id/to_item_id (not a fabricated row UUID)
        from_item_id: {type: string, format: uuid}
        to_item_id: {type: string, format: uuid}
        key: {type: string}
        status: {$ref: '#/components/schemas/Status'}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    WorkContextCommentFact:
      type: object
      additionalProperties: false
      required: [source, source_id, author_id, excerpt, created_at]
      properties:
        source: {type: string, const: work_comments}
        source_id: {type: string, format: uuid}
        author_id: {type: string, format: uuid}
        excerpt: {type: string, maxLength: 240}
        created_at: {type: string, format: date-time}
    WorkContextReviewFact:
      type: object
      additionalProperties: false
      required: [source, source_id, actor_id, outcome, work_version, self_review,
        reference_kind, reference_value, excerpt, recorded_at]
      properties:
        source: {type: string, const: work_role_entries}
        source_id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        outcome: {$ref: '#/components/schemas/RoleOutcome'}
        work_version: {type: integer, minimum: 1}
        self_review: {type: boolean}
        reference_kind: {$ref: '#/components/schemas/RoleReferenceKind'}
        reference_value: {type: string}
        excerpt: {type: string, maxLength: 240}
        recorded_at: {type: string, format: date-time}
    WorkContextCoverageFact:
      type: object
      additionalProperties: false
      required: [source, source_key, work_item_id, test_case_id, key,
        published_version_id, revision]
      properties:
        source: {type: string, const: test_case_coverage}
        source_key:
          type: string
          description: Stable composite relation key projectID/work_item_id/test_case_id (not a fabricated row UUID)
        work_item_id: {type: string, format: uuid}
        test_case_id: {type: string, format: uuid}
        key: {type: string}
        published_version_id: {type: [string, 'null'], format: uuid}
        revision: {type: integer, minimum: 1}
    WorkContextAttemptFact:
      type: object
      additionalProperties: false
      required: [source, source_id, run_id, run_item_id, test_case_id,
        test_case_version_id, attempt_no, status, source_kind,
        observed_at, ingested_at, excerpt]
      properties:
        source: {type: string, const: test_attempts}
        source_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        run_item_id: {type: string, format: uuid}
        test_case_id: {type: string, format: uuid}
        test_case_version_id: {type: string, format: uuid}
        attempt_no: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/TestResultStatus'}
        source_kind: {type: string, enum: [manual, external, junit]}
        observed_at: {type: string, format: date-time}
        ingested_at: {type: string, format: date-time}
        excerpt: {type: string, maxLength: 240}
    WorkContextHistoricalAttributionFact:
      type: object
      additionalProperties: false
      description: |
        Goose21 append-only legacy Run provenance only. The historic Run is
        NOT task-bound and this fact grants no TestRun/Attempt/Artifact access.
        source_id is the real original TestRun UUID (the attribution table has
        a composite project/run PK), not a fabricated attribution UUID.
      required: [source, source_id, run_id, attribution_kind, role_entry_ids,
        acceptance_ids, recorded_at]
      properties:
        source: {type: string, const: historical_test_run_attributions}
        source_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        attribution_kind: {type: string, const: unique_explicit_historical_reference}
        role_entry_ids:
          type: array
          items: {type: string, format: uuid}
        acceptance_ids:
          type: array
          items: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
    WorkContextArtifactFact:
      type: object
      additionalProperties: false
      required: [source, source_id, id, sha256, filename, size_bytes, ready_at]
      properties:
        source: {type: string, const: artifacts}
        source_id: {type: string, format: uuid}
        id: {type: string, format: uuid}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        filename: {type: string}
        size_bytes: {type: integer, minimum: 0}
        ready_at: {type: string, format: date-time}
    WorkContextExternalReferenceFact:
      type: object
      additionalProperties: false
      required: [source, source_id, provider, kind, external_id, url, created_at]
      properties:
        source: {type: string, const: external_references}
        source_id: {type: string, format: uuid}
        provider: {type: string}
        kind: {type: string}
        external_id: {type: string}
        url: {type: string, format: uri}
        created_at: {type: string, format: date-time}
    WorkContextFact:
      description: |
        Exact persisted source variants; source_id is a real row UUID, while
        composite-link tables use source_key plus their real foreign IDs.
        Context does not confer audit, test or artifact permissions.
      oneOf:
        - $ref: '#/components/schemas/WorkContextDependencyFact'
        - $ref: '#/components/schemas/WorkContextCommentFact'
        - $ref: '#/components/schemas/WorkContextReviewFact'
        - $ref: '#/components/schemas/WorkContextCoverageFact'
        - $ref: '#/components/schemas/WorkContextAttemptFact'
        - $ref: '#/components/schemas/WorkContextHistoricalAttributionFact'
        - $ref: '#/components/schemas/WorkContextArtifactFact'
        - $ref: '#/components/schemas/WorkContextExternalReferenceFact'
    TaskAction:
      type: string
      description: Exact server-domain action identifier, not a permission token
      enum: [task.claim, task.update, task.comment, task.start,
        task.submit_review, task.cancel, task.release, task.reassign,
        task.report_test, task.read_test, task.read_evidence, task.attach_evidence,
        task.record_executor, task.record_tester, task.claim_review, task.record_review,
        task.return_for_work, task.release_review, task.complete_independent, task.complete_owner]
    TaskCapabilities:
      type: object
      additionalProperties: false
      required: [schema_version, project_mode, work_item_id, work_version,
        policy_version, review_mode, policy_source, my_capacity,
        allowed_actions, verification_required]
      properties:
        schema_version: {type: integer, const: 1}
        project_mode: {type: string, enum: [legacy, task_scoped]}
        work_item_id: {type: string, format: uuid}
        work_version: {type: integer, minimum: 1}
        policy_version: {type: integer, minimum: 1}
        review_mode: {type: string, enum: [owner_acceptance, independent_review]}
        policy_source: {type: string}
        my_capacity:
          type: array
          uniqueItems: true
          items: {type: string, enum: [candidate, executor, reviewer, owner]}
        allowed_actions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/TaskAction'}
        denied_reasons:
          type: object
          additionalProperties:
            type: string
            enum: [participation_required, project_explicit_deny, not_independent,
              status_or_relation, project_permission_required, not_current_task_capacity]
          description: Safe coarse reasons only; never includes other principals or credentials
        verification_required:
          type: boolean
          description: Granted Complete/transfer action still verifies actual selected evidence/target and CAS in its write
    WorkContextPage:
      type: object
      additionalProperties: false
      required: [schema_version, context_revision, project_id, generated_at,
        consistency, work_item, section, items, has_more, paging_limited]
      properties:
        schema_version: {type: integer, const: 2}
        context_revision:
          type: integer
          minimum: 1
          description: WorkItem version only; NOT a transaction snapshot across domains
        project_id: {type: string, format: uuid}
        generated_at: {type: string, format: date-time}
        consistency: {type: string, const: best_effort}
        work_item: {$ref: '#/components/schemas/WorkContextSummary'}
        section:
          type: string
          enum: [overview, dependencies, comments, reviews, acceptance, coverage, attempts, historical_attributions, artifacts, references]
        items:
          type: array
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/WorkContextFact'
              - $ref: '#/components/schemas/WorkAcceptanceHistory'
        has_more: {type: boolean}
        paging_limited:
          type: boolean
          description: True when deeper rows exist but the bounded per-query pagination history ceiling has been reached
        next_cursor: {type: string, maxLength: 512}
        available_sections:
          type: array
          items: {type: string}
          description: Names of possible sections, not grants or row counts
        latest_review: {$ref: '#/components/schemas/WorkContextReviewFact'}
        acceptance: {$ref: '#/components/schemas/WorkAcceptanceHistory'}
        capabilities: {$ref: '#/components/schemas/TaskCapabilities'}
    AgentRunStatus:
      type: string
      description: External host claim only, never a WorkItem or TestAttempt result
      enum: [queued, running, blocked, succeeded, failed, cancelled]
    AgentRunObservability:
      type: string
      description: Computed on read, never authoritative external status
      enum: [current, stale, unknown, terminal]
    ExternalEventInput:
      type: object
      additionalProperties: false
      description: |
        Untrusted, already Adapter-verified external delivery metadata only.
        Qual rejects unknown fields, raw payload, token/secret-like summaries
        and HTML; authentication always comes from the Qual Credential.
      required: [work_item_id, thread_id, source, external_event_id,
        event_type, occurred_at, payload_sha256, summary]
      properties:
        work_item_id: {type: string, format: uuid}
        thread_id: {type: string, format: uuid}
        source:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
        external_event_id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,159}$'
        event_type:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_.-]{0,79}$'
        occurred_at: {type: string, format: date-time}
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        summary:
          type: string
          minLength: 1
          maxLength: 240
          description: Single-line safe display text; must not contain credentials or HTML
    ExternalEvent:
      type: object
      additionalProperties: false
      required: [id, project_id, work_item_id, thread_id, source,
        external_event_id, event_type, occurred_at, received_at,
        payload_sha256, summary, reporter_principal_id]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        work_item_id: {type: string, format: uuid}
        thread_id: {type: string, format: uuid}
        source: {type: string}
        external_event_id: {type: string}
        event_type: {type: string}
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        summary: {type: string, maxLength: 240}
        reporter_principal_id: {type: string, format: uuid}
    ExternalEventPage:
