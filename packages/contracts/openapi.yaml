        disabled_at: {type: [string, 'null'], format: date-time}
    WebhookRegistration:
      allOf:
        - {$ref: '#/components/schemas/WebhookSubscription'}
        - type: object
          properties:
            secret:
              type: string
              description: Only present in first successful registration response. Do not store in source control.
    WebhookPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WebhookSubscription'}}
    WebhookDelivery:
      type: object
      required: [id, event_id, subscription_id, status, attempt_count, next_attempt_at, last_http_status, last_error_code, delivered_at]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, retrying, processing, delivered, dead, cancelled]}
        attempt_count: {type: integer, minimum: 0, maximum: 5}
        next_attempt_at: {type: string, format: date-time}
        last_http_status: {type: [integer, 'null']}
        last_error_code: {type: [string, 'null']}
        delivered_at: {type: [string, 'null'], format: date-time}
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WebhookDelivery'}}
    JUnitImportSummary:
      type: object
      required: [id, run_id, sha256, filename, imported_count, passed, failed, skipped]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        sha256: {type: string, minLength: 64, maxLength: 64}
        filename: {type: string}
        imported_count: {type: integer, minimum: 1}
        passed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
