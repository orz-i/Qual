    get:
      tags: [WorkItems]
      operationId: listProjectReviewQueue
      summary: Read project WorkItems awaiting review or with a latest needs-work decision
      description: |
        Requires effective work:read. This is a project-scoped summary of
        existing work status and immutable Reviewer RoleEntries, not the audit
        stream. work:review and audit:read are NOT granted by this endpoint.
        Offset pagination is not a stable snapshot; clients must disclose the
        loaded range. No writes or automatic approvals occur.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Scoped review queue, most recently updated first within each queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectID}/attention:
    get:
      tags: [WorkItems]
      operationId: listProjectAttention
      summary: Bounded read-only attention items derived from existing Review, AgentRun and Event facts
      description: |
        Requires effective work:read. Project-scoped, no raw Audit or private Artifact
        and no automatic approvals, WorkItem status changes or agent execution.
        At most one highest-urgency item per WorkItem; review needs_work and
        explicit re-submission retain the exact existing ReviewQueue semantics.
        AgentRun blocked/stale/unknown and allowlisted external needs_input /
        attention.required Events are only untrusted attention hints. Stale
        is calculated from server last_seen, never from claimed source time.
        Event hints appear for up to seven days while the WorkItem has not
        been updated after receipt; they never assert a Human decision.
        Offset pagination is non-snapshot and capped at 500 ordered items.
        For full history use WorkItem/Thread/AgentRun scoped endpoints.
        This route is registered only with Goose17's requisite tables.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 30}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 450, default: 0}}
      responses:
        '200':
          description: Ranked project-scoped attention facts with bounded pagination
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttentionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/projects/{projectID}/external-events:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [ExternalEvents]
      operationId: recordExternalEvent
      summary: Record one previously authenticated external Adapter delivery fact
      description: |
        Requires explicit event:write in the Credential Scope AND Project Allow,
        including for administrators and Integration reporters. It is never
        inherited from work:write, webhook:manage or run:report. Provider/source
        strings are untrusted labels, not an authenticated actor. The Adapter,
        not Qual, verifies any external webhook signature. The Event must
        reference an existing active WorkItem-Thread link from this Project.
        One (project,source,external_event_id) maps immutably to one fact;
        exact replay returns the same Event, conflicting content returns 409.
        Audit/Activity/Outbox contain provenance only, not the summary or body.
        This does not mutate WorkItem, Test, Review or AgentRun state.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalEventInput'}
      responses:
        '201':
          description: Persisted immutable Event or identical idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428':
          description: Missing or invalid Idempotency-Key
  /api/v1/projects/{projectID}/work-items/{itemID}/external-events:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [ExternalEvents]
      operationId: listWorkItemExternalEvents
      summary: Read bounded immutable Event facts linked to one WorkItem
      description: |
        Requires work:read; event:write is never sufficient for reading.
        A cursor is the last Event UUID returned for this Project and WorkItem.
        Page order is received_at descending then id descending, not occurred_at.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
        - name: cursor
