openapi: 3.1.1
info:
  title: Qual HTTP API
  version: 0.9.0
  description: |
    Phase 5: project-scoped work, versioned testing, private evidence, archives and audited webhook delivery.
    CLI is a REST client and stdio MCP reuses application services; neither
    executes Agents, tests or CI. Remote MCP OAuth and production Human OIDC
    are not yet implemented.
servers:
  - url: /
security:
  - BearerToken: []
  - BrowserSession: []
tags:
  - name: BrowserAuth
    description: Controlled loopback-only one-time Human login and revocable session
  - name: System
    description: Process liveness probes
  - name: WorkItems
    description: Authorized Task and Bug records with optimistic concurrency
  - name: AgentRuns
    description: Authenticated external execution telemetry, never an executor or completion decision
  - name: ExternalEvents
    description: Append-only authorized Adapter delivery facts; never an Agent executor
  - name: Access
    description: Project-level Human/Agent explicit permissions with immutable audit
  - name: RoleHistory
    description: Append-only capacity/provenance for a single real Principal across multiple responsibilities
  - name: Collaboration
    description: Append-only comments and acyclic project dependencies
  - name: History
    description: Project activity and restricted audit metadata
  - name: TestManagement
    description: Immutable test specifications and externally reported execution facts
  - name: Evidence
    description: Private S3-backed artifacts and HTTPS references
  - name: Archive
    description: Human-controlled verified ZIP/JSONL project exports
  - name: Webhooks
    description: Encrypted subscriptions and durable signed Outbox delivery
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Process liveness (not dependency readiness)
      responses:
        '200':
          description: HTTP process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      summary: Non-sensitive database/schema/S3 dependency readiness (not liveness)
      description: |
        Fails closed with HTTP 503 when not configured or a required dependency
        is unavailable. Never reveals DSN, S3 bucket, internal IP or credentials.
      responses:
        '200':
          description: Required dependencies are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Dependencies missing, not ready or timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /internal/metrics:
    get:
      tags: [System]
      operationId: getOperationalMetrics
      summary: Conditional operator-only Prometheus text metrics with route-template labels
      description: |
        Route is absent (404) unless QUAL_METRICS_TOKEN is configured with
        a separate high-entropy secret, at least 32 characters. Not a project
        PAT and not a browser Session credential. Only bind Qual to loopback.
      security:
        - OperationalToken: []
      responses:
        '200':
          description: Prometheus text 0.0.4 exposition
          content:
            text/plain:
              schema: {type: string}
        '401':
          description: Missing or invalid operations-only Bearer token
        '404':
          description: No operational token configured
  /api/v1/auth/login:
    post:
      tags: [BrowserAuth]
      operationId: exchangeBrowserLoginCode
      security: []
      summary: Exchange an offline one-time Human code for an HttpOnly local browser session
      description: |
        Controlled loopback development only. The response sets an HttpOnly
        SameSite=Strict session cookie. Requests must originate from the
        configured local browser origin; code expires within five minutes.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserLoginRequest'
      responses:
        '200':
          description: Browser session established; Set-Cookie header is HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Login rate limit
  /api/v1/auth/session:
    get:
      tags: [BrowserAuth]
      operationId: getBrowserSession
      security:
        - BrowserSession: []
      summary: Get signed-in Human session and a CSRF token for this process
      responses:
        '200':
          description: Session and authorized project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [BrowserAuth]
      operationId: logoutBrowserSession
      security:
        - BrowserSession: []
      summary: Revoke the current browser session and credential immediately
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/projects:
    get:
      tags: [BrowserAuth]
      operationId: listAccessibleProjects
      summary: List Projects visible to the authenticated Human or Agent
      responses:
        '200':
          description: Authorized projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/projects/{projectID}/test-suites:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [TestManagement]
      operationId: listTestSuites
      summary: List project test suites
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuitePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [TestManagement]
      operationId: createTestSuite
      summary: Create a test suite
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-cases:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [TestManagement]
      operationId: listTestCases
      summary: List project TestCases and draft revision
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCasePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [TestManagement]
      operationId: createTestCase
      summary: Create a test case draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-cases/{caseID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/CaseID'
    get:
      tags: [TestManagement]
      operationId: getTestCase
      summary: Read one test case draft
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    patch:
      tags: [TestManagement]
      operationId: updateTestCase
      summary: Update draft with If-Match revision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseInput'
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-cases/{caseID}/versions:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/CaseID'
    get:
      tags: [TestManagement]
      operationId: listTestCaseVersions
      summary: Read immutable test specification versions
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseVersionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [TestManagement]
      operationId: publishTestCase
      summary: Publish immutable version from a draft revision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTestCaseInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-cases/{caseID}/coverage:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/CaseID'
    get:
      tags: [TestManagement]
      operationId: getTestCaseCoverage
      summary: Read work items verified by this test case
      responses:
        '200':
          description: Linked work items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveragePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [TestManagement]
      operationId: linkTestCaseCoverage
      summary: Link existing project work item to test case
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [TestManagement]
      operationId: listTestRuns
      summary: List recorded test runs
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [TestManagement]
      operationId: createTestRun
      summary: Record a run bound to exact published versions; does not execute tests
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRunInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-runs/{runID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RunID'
    get:
      tags: [TestManagement]
      operationId: getTestRun
      summary: Read frozen RunItems and latest reported results
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-run-items/{itemID}/attempts:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [TestManagement]
      operationId: listTestAttempts
      summary: Read latest 500 immutable attempts for a RunItem
      responses:
        '200':
          description: Successfully retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAttemptPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [TestManagement]
      operationId: recordTestAttempt
      summary: Append external/manual test result; no test execution
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAttemptInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-attempts/{attemptID}/defects:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AttemptID'
    get:
      tags: [TestManagement]
      operationId: listTestAttemptDefects
      summary: Read existing Bug links for an immutable Failed Attempt
      description: |
        Requires effective project test:read. Only relations linked to the requested
        Attempt within this project are returned. No execution or state changes occur.
      responses:
        '200':
          description: Existing Bug links; empty items if none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDefectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [TestManagement]
      operationId: linkTestFailureDefect
      summary: Create or link a Bug only for failed attempt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefectLinkInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/test-runs/{runID}/junit-imports:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RunID'
    post:
      tags: [TestManagement]
      operationId: importJUnitReport
      summary: Import bounded JUnit XML into existing frozen RunItems
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReportFilename'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JUnitImportSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/work-items/{itemID}/test-coverage:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [TestManagement]
      operationId: getWorkItemTestCoverage
      summary: Read test cases verifying this work item
      responses:
        '200':
          description: Linked test cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveringTestCasePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectID}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Evidence]
      operationId: listArtifacts
      summary: List authorized artifacts for target
      parameters:
        - $ref: '#/components/parameters/TargetKindQuery'
        - $ref: '#/components/parameters/TargetIDQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [Evidence]
      operationId: beginArtifact
      summary: Create pending SHA-256 verified upload slot
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactBeginInput'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/artifacts/{artifactID}:
