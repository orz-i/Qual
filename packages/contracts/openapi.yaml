              schema: {$ref: '#/components/schemas/ProjectReviewPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    put:
      tags: [WorkItems]
      operationId: changeProjectReviewPolicy
      summary: Authorized CAS review policy change
      description: |
        Requires access:manage. Allowing Owner self-acceptance or relaxing
        the high-risk independent-review requirement additionally requires
        an actual Human Workspace Admin, not a delegated Agent manager.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectReviewPolicyChange'}
      responses:
        '200':
          description: Audit- and idempotency-backed updated project review policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectReviewPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/Precondition'}
  /api/v1/projects/{projectID}/work-items/{itemID}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    post:
      tags: [WorkItems]
      operationId: completeWorkItem
      summary: Explicit review-gated acceptance of a WorkItem
      description: |
        Requires active work:review and an explicit server-validated decision.
        Only available on the Goose13 acceptance schema. Legacy transitions
        to done are rejected after Goose13; historical done records remain
        legacy_unclassified and are not rewritten. Owner acceptance is never
        represented as independent review.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoneDecisionInput'}
      responses:
        '200':
          description: Successful explicit completion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/Precondition'}
  /api/v1/projects/{projectID}/work-items/{itemID}/review-policy:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [WorkItems]
      operationId: getWorkReviewPolicy
      summary: Read effective project/WorkItem review policy and high-risk limits
      responses:
        '200':
          description: Server-resolved effective policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkReviewPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    put:
      tags: [WorkItems]
      operationId: changeWorkReviewPolicy
      summary: Explicit, authorized CAS WorkItem review policy override
      description: |
        Requires access:manage. Loosening from independent to Owner mode
        additionally requires an actual Human Workspace Admin and
        project permission for Owner acceptance. This increments the
        WorkItem version and invalidates stale previous Reviewer approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkReviewPolicyChange'}
      responses:
        '200':
          description: Updated versioned WorkItem
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/Precondition'}
  /api/v1/projects/{projectID}/work-items/{itemID}/acceptances:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [WorkItems]
      operationId: getWorkAcceptanceHistory
      summary: Read actual completion decision or explicit legacy_unclassified
      description: |
        On Goose12 and on older Done work items without a structured
        acceptance decision, mode is legacy_unclassified; no reviewer is
        fabricated. On incomplete items mode is not_completed. Requires
        work:read. Never returns credential secrets.
      responses:
        '200':
          description: Read-only authoritative acceptance state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkAcceptanceHistory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/v1/projects/{projectID}/work-items/{itemID}/transitions:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    post:
      tags: [WorkItems]
      operationId: transitionWorkItem
      summary: Apply a legal work state transition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Successful read or mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/work-items/{itemID}/role-entries:
    get:
      tags: [RoleHistory]
      operationId: listWorkRoleEntries
      summary: Recent immutable responsibility records for a WorkItem
      description: |
        Shows the real authenticated Principal and their stated capacity.
        Role tags never impersonate another Agent. List currently returns
        the latest 100 entries; project ZIP includes the full bounded history.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkItemID'
      responses:
        '200':
          description: Append-only role history (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEntriesPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [RoleHistory]
      operationId: recordWorkRoleEntry
      summary: Record one authenticated Principal's task capacity and evidence
      description: |
        Requires WorkItem version, Idempotency-Key and the relevant project
        scopes. Executor requires work:write, tester requires test:write plus
        work:read, reviewer requires work:review plus work:read, and auditor
        requires audit:read plus work:write and work:read. Reviewer passed
        does not by itself make WorkItem done; a state transition is separate.
        self_review is computed by Qual, never accepted from callers.
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/WorkItemID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEntryInput'
      responses:
        '201':
          description: Created or idempotently replayed an immutable role record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/work-items/{itemID}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [Collaboration]
      operationId: listWorkItemComments
      summary: List recent work item comments (up to 100)
      responses:
        '200':
          description: Successful read or mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [Collaboration]
      operationId: addWorkItemComment
      summary: Append an auditable comment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/work-items/{itemID}/dependencies:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [Collaboration]
      operationId: listWorkItemDependencies
      summary: List outgoing blocking dependencies (up to 100)
      responses:
        '200':
          description: Successful read or mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
    post:
      tags: [Collaboration]
      operationId: linkWorkItemDependency
      summary: Create an acyclic project-local blocking dependency
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyRequest'
      responses:
        '201':
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/Precondition'
  /api/v1/projects/{projectID}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [History]
      operationId: listProjectActivity
      summary: Read visible project activity
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Successful read or mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
