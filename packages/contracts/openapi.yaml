  /api/v1/projects/{projectID}/work-items/{itemID}/context:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ItemID'
    get:
      tags: [WorkItems]
      operationId: getWorkItemContext
      summary: Read a bounded, authorization-filtered WorkItem recovery context
      description: |
        Read-only, best-effort projection over persisted WorkItem, review,
        testing and evidence facts. Default overview gives a small summary
        and the latest authorized Reviewer reference. Select exactly one
        section per request and follow its opaque cursor to page histories.
        Test sections require test:read and artifacts require artifact:read;
        all sections first require work:read. Cursor includes WorkItem version;
        after a WorkItem change clients must restart pagination. Independent
        testing, review or artifact changes do not form one atomic snapshot.
        Attempt pages use a bounded (ingested_at,source_id) keyset cursor;
        newly ingested newer attempts cannot shift already-read rows. For
        <=32 linked RunItems a narrow index query is used; for wider fanout
        a materialized project-ordered candidate batch is examined, with
        coverage checked before release of any record. The scan budget is
        hard limited; exhaustion is explicit 503 CONTEXT_QUERY_BUDGET, not
        an apparently successful truncated page. Historical cross-domain
        changes still require source revalidation.
        Historical_attributions is a separate TestRead-protected section of
        Goose21 source IDs and attribution provenance, not the old Attempt
        body/status and never a grant to read an unbound historical Run.
        This endpoint never infers Passed/Done or starts an Agent.
      parameters:
        - name: section
          in: query
          required: false
          schema:
            type: string
            default: overview
            enum: [overview, dependencies, comments, reviews, acceptance, coverage, attempts, historical_attributions, artifacts, references]
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 512}
          description: Opaque section/Project/WorkItem/version-specific cursor; Attempt pages carry a stable server-ingested keyset anchor
      responses:
        '200':
          description: Bounded facts from authorized source sections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkContextPage'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: |
            CONTEXT_QUERY_BUDGET: a bounded Attempt read exhausted its
            internal candidate scan budget. No partial items/has_more value
            is returned. Clients can use authorized source-level Test APIs;
            do not infer absence or retry without a narrower query.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
