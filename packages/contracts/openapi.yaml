          schema:
            type: string
            minLength: 36
            maxLength: 1849
          description: Comma-separated list of 1..50 Principal UUIDs already referenced in project work
      responses:
        '200':
          description: Minimal current project identity summaries; non-members omitted
          headers:
            Cache-Control:
              schema: {type: string}
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPrincipalPage'
